# ──────────────────────────────
#   FONT
# ──────────────────────────────
font=JetBrainsMono Nerd Font:size=18

# ──────────────────────────────
#   WINDOW BEHAVIOR
# ──────────────────────────────
pad=14x14

[csd]
preferred=none

[main]
shell=zsh

# ──────────────────────────────
#   SCROLLBACK
# ──────────────────────────────

[scrollback]
lines=5000


# ──────────────────────────────
#   COLORS
# ──────────────────────────────
[colors-dark]
alpha=0.98
foreground=fbfbfb
background=1b1e2b
regular0=1b1e2b  # black (bg_dark)
regular1=d06178  # red
regular2=b4c4b4  # green
regular3=cfcfbf  # yellow
regular4=959dcb  # blue
regular5=b9a3eb  # magenta (purple)
regular6=89ddff  # cyan
regular7=a6accd  # white (fg)
bright0=8796b0   # bright black (grey)
bright1=d06178   # bright red
bright2=b4c4b4   # bright green
bright3=b4b4b4   # bright yellow (orange)
bright4=959dcb   # bright blue
bright5=b9a3eb   # bright magenta (purple)
bright6=89ddff   # bright cyan
bright7=ffffff   # bright white
