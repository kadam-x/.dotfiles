# ──────────────────────────────
#   FONT
# ──────────────────────────────
font=JetBrainsMono Nerd Font:size=18

# ──────────────────────────────
#   WINDOW BEHAVIOR
# ──────────────────────────────
pad=14x14

[csd]
preferred=none

[main]
shell=zsh

# ──────────────────────────────
#   SCROLLBACK
# ──────────────────────────────

[scrollback]
lines=5000


# ──────────────────────────────
#   COLORS
# ──────────────────────────────
[colors-dark]
alpha=0.98
background=0d0e17
foreground=cdcdcd
regular0=252530  # black
regular1=d8647e  # red
regular2=7fa563  # green
regular3=f3be7c  # yellow
regular4=6e94b2  # blue
regular5=bb9dbd  # magenta
regular6=aeaed1  # cyan
regular7=cdcdcd  # white
bright0=606079   # bright black
bright1=e08398   # bright red
bright2=99b782   # bright green
bright3=f5cb96   # bright yellow
bright4=8ba9c1   # bright blue
bright5=c9b1ca   # bright magenta
bright6=c3c3d5   # bright cyan
bright7=e3e6ed   # bright white
