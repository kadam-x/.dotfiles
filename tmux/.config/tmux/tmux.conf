set -s escape-time 0
set -g prefix C-a
set -g base-index 1
set -g mouse on
setw -g mode-keys vi
set -g default-terminal "tmux-256color"
set -g default-shell "/bin/zsh"

unbind C-b
bind C-a send-prefix

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"

set -ag terminal-overrides ",xterm-256color:RGB"

setw -g pane-base-index 1
set -g renumber-windows on
set -g status-interval 10

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z

set -g status-position top
set -g status-justify "left"
set -g status-left-length 100
set -g status-right-length 100
set -g pane-border-style "fg=#3a3f58"
set -g pane-active-border-style "fg=#ffffff"
set -g status-style "bg=default,fg=#a0a0a0"
set -g message-style "fg=#a0a0a0,bg=default"
set -g message-command-style "fg=#a0a0a0,bg=default"
set -g window-status-activity-style "fg=#a0a0a0,bg=default,none"
set -g window-status-separator ""
set -g window-status-style "fg=#a0a0a0,bg=default,none"
set -g window-status-current-format "#[fg=#a0a0a0,bg=default,none] #I*: #W "
set -g window-status-format "#[fg=#a0a0a0,bg=default,none] #I: #W "
set -g status-left ""
set -g status-right "#[fg=#a0a0a0,bg=default] #S"
set -g mode-style "fg=#a0a0a0,bg=#2a2e3f,bold"
set -g clock-mode-colour "#a0a0a0"

bind ? display-popup -E -w 40% -h 40% "printf '\033[1;38;2;156;141;126mQUICK REFERENCE\033[0m\n\033[1;33mPREFIX: Ctrl-a\033[0m\n\033[1;36mPANES\033[0m               \033[1;36mWINDOWS\033[0m            \033[1;36mSESSIONS\033[0m\n\033[0;38;2;156;141;126m─────\033[0m               \033[0;38;2;156;141;126m───────\033[0m            \033[0;38;2;156;141;126m────────\033[0m\n\033[0;32m|\033[0m split vert        \033[0;32mc\033[0m new              \033[0;32ms\033[0m list\n\033[0;32m-\033[0m split horiz       \033[0;32mn\033[0m next             \033[0;32md\033[0m detach\n\033[0;32mhjkl\033[0m navigate       \033[0;32mp\033[0m prev             \033[0;32m$\033[0m rename\n\033[0;32mHJKL\033[0m resize         \033[0;32m,\033[0m rename\n\033[0;32mm\033[0m maximize          \033[0;32m&\033[0m kill\n\033[0;32mx\033[0m kill\n\033[0;33m?\033[0m help  \033[0;33mr\033[0m reload  \033[0;33m:\033[0m command mode\n\033[2mPress any key to close\033[0m\n' && read -n 1"
